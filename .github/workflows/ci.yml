name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Apple platforms
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build optimized library
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme swift-hnsw \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/swift-hnsw-release" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build optimized iOS simulator library
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme swift-hnsw \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/swift-hnsw-ios-release" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swift-hnsw \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/swift-hnsw-tests" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

  sanitizer:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Address Sanitizer
            flag: -enableAddressSanitizer
            scratch: address
          - name: Thread Sanitizer
            flag: -enableThreadSanitizer
            scratch: thread

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run full sanitized test suite
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme swift-hnsw \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/swift-hnsw-${{ matrix.scratch }}" \
            "${{ matrix.flag }}" YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES
